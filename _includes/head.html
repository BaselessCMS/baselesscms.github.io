<head>

	<meta charset='utf-8' />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="generator" content="Jekyll {{ jekyll.version }}" />
	<meta name="language" content="{{ site.language }}" />

	<!-- Swap `no-js` class with `js` class in html element. -->
	<script>(function(html){html.className = html.className.replace(/\bno-js\b/,'js')})(document.documentElement);</script>

	<link rel="profile" href="https://gmpg.org/xfn/11" />
	<link href="{{ site.url }}{{ page.url }}" rel="canonical" />

	<!-- Browser title -->
	<title>{{ site.title }}</title>

	<!-- jQuery from CDN -->
	<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
	<script src="https://code.jquery.com/jquery-migrate-4.0.2.min.js"></script>
	<script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

	<!-- Theme stylesheets -->
	{%- assign css_ver = 'now' | date: "%Y-%m-%d-%H-%M" | prepend: "?v=" %}
	<link rel="stylesheet" href="{{ '/assets/css/style.min.css' | append: css_ver | relative_url }}" />

	{% if site.favicon -%}
	<!-- Site icon -->
	<link rel="icon" href="{{ '/assets/img/' | append: site.favicon | relative_url }}" sizes="32x32" />
	<link rel="icon" href="{{ '/assets/img/' | append: site.favicon | relative_url }}" sizes="192x192" />
	<link rel="apple-touch-icon" href="{{ '/assets/img/' | append: site.favicon | relative_url }}" />
	<meta name="msapplication-TileImage" content="{{ '/assets/img/' | append: site.favicon | relative_url }}" />
	{%- endif %}
</head>
